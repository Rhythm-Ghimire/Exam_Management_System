{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-edit"></i> Edit Result
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Student</label>
                            <input type="text" class="form-control" value="{{ result.student.roll_number }} - {{ result.student.user.get_full_name }}" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control" value="{{ result.subject.code }} - {{ result.subject.name }}" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Exam</label>
                            <input type="text" class="form-control" value="{{ result.exam.subject.name }} - {{ result.exam.date }}" readonly>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Marks Obtained</label>
                                <input type="number" name="marks_obtained" class="form-control" value="{{ result.marks_obtained }}" step="0.01" min="0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Maximum Marks</label>
                                <input type="number" name="max_marks" class="form-control" value="{{ result.max_marks }}" step="0.01" min="0" required>
                            </div>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Current Grade: <strong>{{ result.grade }}</strong> (will be recalculated on save)
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Result
                            </button>
                            <a href="{% url 'manage_results' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
