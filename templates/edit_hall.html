{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-edit"></i> Edit Exam Hall
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Hall Name</label>
                            <input type="text" name="name" class="form-control" value="{{ hall.name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Capacity</label>
                            <input type="number" name="capacity" class="form-control" value="{{ hall.capacity }}" min="1" required>
                            <small class="text-muted">Total number of seats in the hall (must be even for bench pairing)</small>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_available" id="is_available" {% if hall.is_available %}checked{% endif %}>
                                <label class="form-check-label" for="is_available">
                                    Hall is available for exams
                                </label>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Hall
                            </button>
                            <a href="{% url 'manage_halls' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
