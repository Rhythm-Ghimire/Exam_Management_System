{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-user-tie"></i> Manage Invigilators</h2>
        <a href="{% url 'add_invigilator' %}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add Invigilator
        </a>
    </div>
    
    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search invigilators...">
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover" id="invigilatorsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for invigilator in invigilators %}
                        <tr>
                            <td><i class="fas fa-user-tie text-primary"></i> {{ invigilator.name }}</td>
                            <td>{{ invigilator.email }}</td>
                            <td>{{ invigilator.phone }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center">No invigilators found</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    searchTable('searchInput', 'invigilatorsTable');
</script>
{% endblock %}
