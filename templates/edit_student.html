{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-edit"></i> Edit Student
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" name="first_name" class="form-control" value="{{ student.user.first_name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" name="last_name" class="form-control" value="{{ student.user.last_name }}" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ student.user.email }}" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Roll Number</label>
                                <input type="text" name="roll_number" class="form-control" value="{{ student.roll_number }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Branch</label>
                                <select name="branch" class="form-select" required>
                                    <option value="BCA" {% if student.branch == "BCA" %}selected{% endif %}>BCA</option>
                                    <option value="BScCSIT" {% if student.branch == "BScCSIT" %}selected{% endif %}>BScCSIT</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Semester</label>
                                <select name="semester" class="form-select" required>
                                    {% for i in "12345678" %}
                                    <option value="{{ i }}" {% if student.semester|stringformat:"s" == i %}selected{% endif %}>{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Attendance (%)</label>
                                <input type="number" name="attendance" class="form-control" step="0.01" value="{{ student.attendance }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Fees Paid</label>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" name="fees_paid" id="fees_paid" {% if student.fees_paid %}checked{% endif %}>
                                    <label class="form-check-label" for="fees_paid">Yes</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Student
                            </button>
                            <a href="{% url 'manage_students' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
