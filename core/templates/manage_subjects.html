{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-book"></i> Manage Subjects</h2>
        <a href="{% url 'add_subject' %}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add Subject
        </a>
    </div>
    
    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search subjects...">
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover" id="subjectsTable">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Semester</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for subject in subjects %}
                        <tr>
                            <td>{{ subject.code }}</td>
                            <td>{{ subject.name }}</td>
                            <td>{{ subject.semester }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center">No subjects found</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    searchTable('searchInput', 'subjectsTable');
</script>
{% endblock %}
