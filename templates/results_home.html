{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-chart-bar"></i> Manage Results - Step 1: Select Branch</h5>
                </div>
                <div class="card-body">
                    <div class="row g-4">
                        {% for branch in branches %}
                        <div class="col-md-6">
                            <a href="{% url 'results_semester_list' branch.code %}" class="text-decoration-none">
                                <div class="card h-100 {% if branch.code == 'BScCSIT' %}border-primary{% else %}border-success{% endif %}" style="border-width: 3px;">
                                    <div class="card-body text-center">
                                        <div class="mb-3">
                                            <i class="fas fa-graduation-cap fa-4x {% if branch.code == 'BScCSIT' %}text-primary{% else %}text-success{% endif %}"></i>
                                        </div>
                                        <h4 class="{% if branch.code == 'BScCSIT' %}text-primary{% else %}text-success{% endif %}">{{ branch.code }}</h4>
                                        <p class="text-muted mb-0">{{ branch.name }}</p>
                                        <div class="mt-3">
                                            <button class="btn {% if branch.code == 'BScCSIT' %}btn-primary{% else %}btn-success{% endif %} btn-lg">
                                                Select Branch <i class="fas fa-arrow-right"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
