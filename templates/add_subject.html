{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-book"></i> Add New Subject
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Branch</label>
                            <select name="branch" class="form-select" required>
                                <option value="">Select Branch</option>
                                <option value="BCA">BCA</option>
                                <option value="BScCSIT">BScCSIT</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Subject Code</label>
                            <input type="text" name="code" class="form-control" placeholder="e.g., CACS101" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Subject Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g., Computer Fundamentals" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Semester</label>
                            <select name="semester" class="form-select" required>
                                <option value="">Select Semester</option>
                                {% for i in "12345678" %}
                                <option value="{{ i }}">{{ i }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Subject
                            </button>
                            <a href="{% url 'manage_subjects' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
